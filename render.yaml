# render.yaml — Render.com deployment configuration
# Deploy both backend (Node.js) and frontend (Next.js) from one repo

services:
  # ── Backend: Node.js + C++ Matching Engine ─────────────────────────────────
  - type: web
    name: corematach-backend
    runtime: node
    rootDir: backend
    # 1) Install Node deps
    # 2) Compile the C++ matching engine for Linux (g++ is available on Render Ubuntu env)
    buildCommand: |
      npm install
      g++ -std=c++20 -O3 -I./src \
        -o matching_engine \
        src/main_cli.cpp \
        src/engine/order_book.cpp \
        src/engine/matching_engine.cpp
      chmod +x matching_engine
      echo "C++ engine compiled: $(./matching_engine --version 2>/dev/null || echo 'ok')"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DB_NAME
        value: CoreMatch
      - key: JWT_EXPIRY
        value: "86400"
      - key: START_SIMULATOR
        value: "true"
      - key: SIMULATOR_BOTS
        value: "5"
    plan: free

  # ── Frontend: Next.js Static Site ──────────────────────────────────────────
  - type: web
    name: corematach-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://corematach-backend.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://corematach-backend.onrender.com/ws
    plan: free

